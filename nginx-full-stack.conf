# Complete Nginx configuration for React + Vite + Node.js API + AI Models
# Serves both frontend and backend from same domain
# Optimized for production deployment with face detection AI

# Rate limiting zones - prevent API abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=1r/m;

# Upload size limit for photo uploads
client_max_body_size 50M;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;  # Change this!

    # Redirect to HTTPS (after SSL is setup)
    # Uncomment after running: sudo certbot --nginx
    # return 301 https://$server_name$request_uri;
}

server {
    # Uncomment these after SSL setup:
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Comment this out after SSL setup:
    listen 80;

    server_name yourdomain.com www.yourdomain.com;

    # Security headers (production-ready)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:;" always;

    # Upload size limit (override global for this server)
    client_max_body_size 50M;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ==========================================
    # Frontend - React + Vite Static Files
    # ==========================================

    # Root - Serve React app
    location / {
        root /opt/photo-viewer/client/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ONNX models and WASM files
    location /models/ {
        root /opt/photo-viewer/client/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Required for WASM
        types {
            application/wasm wasm;
        }
    }

    # WASM files at root level
    location ~* \.wasm$ {
        root /opt/photo-viewer/client/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            application/wasm wasm;
        }
    }

    # ==========================================
    # Backend - Node.js API
    # ==========================================

    # Standard API endpoints (with rate limiting)
    location /api {
        # Apply rate limiting (10 req/sec with burst of 20)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts for API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't cache API responses
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Face detection/scanning endpoints (longer timeouts, stricter rate limiting)
    location ~ ^/api/(faces|scan|cluster) {
        # Stricter rate limiting for AI operations (1 req/min)
        limit_req zone=scan_limit burst=2 nodelay;

        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for AI processing (up to 10 minutes)
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for streaming responses
        proxy_buffering off;

        # Don't cache
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://localhost:3002/health;
        access_log off;
    }
}
