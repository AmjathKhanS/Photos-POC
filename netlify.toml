# Netlify Configuration for Photo Viewer
# Frontend deployment with API proxying to Render backend

[build]
  # Build command
  command = "cd client && npm install && npm run build"

  # Output directory
  publish = "client/dist"

  # Base directory (optional)
  base = "/"

[build.environment]
  # Build-time environment variables
  VITE_API_URL = "https://photos-poc.onrender.com"

# Redirect rules are in client/public/_redirects
# Netlify automatically uses that file

# Build settings
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
